<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doğum Günü Kutlaması</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body {
  font-family: 'Arial', sans-serif;
  background: linear-gradient(135deg,#1e1e2f,#2c2c54);
  overflow:hidden;
  height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  position:relative;
  padding:20px;
}
/* ... STİLLERİN AYNI HALİ BURADA ... */
</style>
</head>
<body>

<div id="overlay"></div>
<div id="popup">
  <h3>🎉 Sürpriz!</h3>
  <p id="popMsg"></p>
  <button onclick="closePopup()">Tamam</button>
</div>

<h1 class="neon">Happy Birthday 🎉</h1>

<div class="card">
  <h2 id="person"></h2>
  <p id="noteText"></p>
  <button id="btn">Kutlama Mesajı</button>
</div>

<audio id="bgMusic" src="music_akordiyon.mp3?v=3" loop></audio>
<button id="musicBtn" class="musicBtn off"></button>

<footer>
  Bu sayfa: Kemalettin Duyar tarafından yapılmıştır.
</footer>

<script>
// URL parametreleri
const url = new URLSearchParams(location.search);
const name = url.get("name") || "Mutlu Yıllar!";
const note = url.get("note") || "";
const msg = url.get("msg") || "Doğum günün kutlu olsun!";

document.getElementById("person").textContent = name;
document.getElementById("noteText").textContent = note;

// Popup
const pop = document.getElementById("popup");
const overlay = document.getElementById("overlay");
const popMsg = document.getElementById("popMsg");

document.getElementById("btn").onclick = () => { 
  popMsg.textContent = msg; 
  pop.classList.add("show"); 
  overlay.classList.add("show"); 
};

function closePopup() { 
  pop.classList.remove("show"); 
  overlay.classList.remove("show"); 
}

// (Balon, konfeti ve müzik kodları burada devam eder)
</script>

</body>
</html>
