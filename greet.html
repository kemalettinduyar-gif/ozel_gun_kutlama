<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doğum Günü Kutlaması</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body {
  font-family: 'Arial', sans-serif;
  background: linear-gradient(135deg,#1e1e2f,#2c2c54);
  height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:20px;
  color:white;
}

/* NEON BAŞLIK */
.neon {
  font-size:42px;
  color:#fff;
  text-shadow:0 0 10px #ff00cc, 0 0 20px #ff00cc;
  margin-bottom:20px;
}

/* KART */
.card {
  width:90%;
  max-width:500px;
  background:#ffffff10;
  padding:20px;
  border-radius:15px;
  backdrop-filter:blur(10px);
  border:1px solid #ffffff30;
  text-align:center;
}

.card button {
  margin-top:15px;
  padding:12px 20px;
  background:#ff00cc;
  border:none;
  border-radius:10px;
  color:white;
  font-size:16px;
  cursor:pointer;
}
.card button:hover {
  opacity:0.8;
}

/* POPUP */
#overlay {
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:#00000080;
  opacity:0;
  pointer-events:none;
  transition:0.3s;
}

#overlay.show {
  opacity:1;
  pointer-events:auto;
}

#popup {
  position:fixed;
  top:50%;
  left:50%;
  width:300px;
  transform:translate(-50%,-50%) scale(0.6);
  background:white;
  color:black;
  padding:20px;
  border-radius:15px;
  text-align:center;
  opacity:0;
  transition:0.25s;
  pointer-events:none;
}

#popup.show {
  opacity:1;
  transform:translate(-50%,-50%) scale(1);
  pointer-events:auto;
}

#popup button {
  margin-top:10px;
  padding:10px 18px;
  border:none;
  background:#007bff;
  color:white;
  border-radius:8px;
  cursor:pointer;
}

/* MÜZİK BUTONU */
.musicBtn {
  width:50px;
  height:50px;
  border-radius:50%;
  border:none;
  cursor:pointer;
  background:url('sound_off.png') center/cover no-repeat;
  position:fixed;
  bottom:20px;
  right:20px;
}

.musicBtn.on {
  background:url('sound_on.png') center/cover no-repeat;
}

/* FOOTER */
footer {
  margin-top:25px;
  font-size:14px;
  opacity:0.7;
}
</style>

</head>
<body>

<!-- POPUP -->
<div id="overlay"></div>
<div id="popup">
  <h3>🎉 Sürpriz!</h3>
  <p id="popMsg"></p>
  <button onclick="closePopup()">Tamam</button>
</div>

<h1 class="neon">Happy Birthday 🎉</h1>

<div class="card">
  <h2 id="person"></h2>
  <p id="noteText"></p>
  <button id="btn">Kutlama Mesajı</button>
</div>

<audio id="bgMusic" src="music_akordiyon.mp3?v=3" loop></audio>
<button id="musicBtn" class="musicBtn"></button>

<footer>
  Bu sayfa: Kemalettin Duyar tarafından yapılmıştır.
</footer>

<script>
// URL parametreleri
const url = new URLSearchParams(location.search);
const name = url.get("name") || "Mutlu Yıllar!";
const note = url.get("note") || "";
const msg = url.get("msg") || "Doğum günün kutlu olsun!";

document.getElementById("person").textContent = name;
document.getElementById("noteText").textContent = note;

// Popup
const pop = document.getElementById("popup");
const overlay = document.getElementById("overlay");
const popMsg = document.getElementById("popMsg");

document.getElementById("btn").onclick = () => {
  popMsg.textContent = msg;
  pop.classList.add("show");
  overlay.classList.add("show");
};

function closePopup(){
  pop.classList.remove("show");
  overlay.classList.remove("show");
}

// MÜZİK BUTONU
const music = document.getElementById("bgMusic");
const musicBtn = document.getElementById("musicBtn");

musicBtn.onclick = () => {
  if (music.paused) {
    music.play();
    musicBtn.classList.add("on");
  } else {
    music.pause();
    musicBtn.classList.remove("on");
  }
};
</script>

</body>
</html>
